services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gt
      POSTGRES_PASSWORD: gt
      POSTGRES_DB: ghosttyping
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://gt:gt@db:5432/ghosttyping
    ports: ["8000:8000"]
    depends_on: [db]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
